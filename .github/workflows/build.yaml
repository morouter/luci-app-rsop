name: I go to Comicon, guns, and thrash metal shows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.pkg_arch }}
    runs-on: ubuntu-latest
    env:
      project_name: luci-app-rsop
    strategy:
      fail-fast: false
      matrix:
        include:
          - server_asset: "linux-musl-amd64"
            pkg_arch: "x86_64"
            sdk_arch: "x86-64"
          - server_asset: "linux-musl-arm64v8"
            pkg_arch: "aarch64_generic"
            sdk_arch: "rockchip-armv8"
          - server_asset: "linux-musl-arm64v8"
            pkg_arch: "aarch64_cortex-a53"
            sdk_arch: "mediatek-filogic"

    steps:
      - name: Prepare SDK
        id: sdk
        uses: moaeiou/moaeiou/actions/prepare-sdk@main
        with:
          sdk_arch: ${{ matrix.sdk_arch }}

      - name: Create directory
        shell: bash
        run: |
          mkdir -p ${{ steps.sdk.outputs.sdk_dir }}/package/${{ env.project_name }}/

      - name: Checkout
        uses: actions/checkout@main
        with:
          path: ${{ steps.sdk.outputs.sdk_dir }}/package/${{ env.project_name }}/

      - name: Get version
        id: get_version
        shell: bash
        run: |
          cd ${{ steps.sdk.outputs.sdk_dir }}/package/${{ env.project_name }}/
          VERSION=$(grep -E "^PKG_VERSION[[:space:]]*:=" Makefile | sed -E 's/.*:=[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare before compile
        shell: bash
        run: |
          cd ${{ steps.sdk.outputs.sdk_dir }}/package/${{ env.project_name }}/
          if [ "${{ matrix.pkg_arch }}" != "x86_64" ]; then
            sed -i 's/x86_64/${{ matrix.pkg_arch }}/g' ./Makefile
          fi
          mkdir -p root/usr/bin
          rm -f root/usr/bin/DONOTREMOVE
          wget -O root/usr/bin/go-rustdesk-server https://github.com/moaeiou/go-rustdesk-server/releases/latest/download/go-rustdesk-server-${{ matrix.server_asset }}
          chmod +x root/usr/bin/go-rustdesk-server

      - name: Build!
        shell: bash
        run: |
          cd ${{ steps.sdk.outputs.sdk_dir }}
          make package/${{ env.project_name }}/compile V=s -j$(nproc)

      - name: Rename compilation files
        shell: bash
        run: |
          mv ${{ steps.sdk.outputs.sdk_dir }}/bin/packages/*/base/luci-app-*.apk ./luci-app-rsop-${{ matrix.pkg_arch }}.apk
          mv ${{ steps.sdk.outputs.sdk_dir }}/bin/packages/*/base/luci-i18n-rsop-zh-cn-*.apk ./luci-i18n-rsop-zh-cn.apk
          mv ${{ steps.sdk.outputs.sdk_dir }}/bin/packages/*/base/luci-i18n-rsop-zh-tw-*.apk ./luci-i18n-rsop-zh-tw.apk
          ln -s ./luci-app-rsop-${{ matrix.pkg_arch }}.apk ./luci-app-rsop-${{ steps.get_version.outputs.version }}-${{ matrix.pkg_arch }}.apk

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: V${{ steps.get_version.outputs.version }}
          files: |
            luci-i18n-rsop-*.apk
            luci-app-rsop-${{ steps.get_version.outputs.version }}-${{ matrix.pkg_arch }}.apk
          body: |
            # 📝 Release Notes
            - Fixes and improvements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to mirror
        uses: moaeiou/moaeiou/actions/rsync@main
        with:
          local: luci-i18n-rsop-*.apk luci-app-rsop-${{ matrix.pkg_arch }}.apk
          remote: luci-app/rsop/
          key: ${{ secrets.SSH_KEY }}
          extra: --exclude='a2s/'
